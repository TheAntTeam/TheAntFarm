# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libegl1 \
          libpulse0 \
          libpulse-mainloop-glib0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libxcb1 \
          '^libxcb.*-dev' \
          libx11-xcb-dev \
          libglu1-mesa-dev \
          libxrender-dev \
          libxi-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    - name: Lint and check formatting with Ruff
      continue-on-error: true
      run: |
        echo "Running Ruff (non-blocking)..."
        ruff check --output-format=github src tests || echo "Ruff lint issues found - check output above"
        ruff format --check --diff src tests || echo "Ruff formatting issues found - check output above"

    - name: Type checking
      continue-on-error: true
      run: |
        echo "Running mypy type checking (non-blocking)..."
        mypy src/TheAntFarm tests --ignore-missing-imports || echo "Type checking issues found - check output above"
    
    - name: Run controller tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_controller_*.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run settings tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_settings_*.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run shape core tests
      run: |
        python -m pytest tests/unit/test_shape_core.py tests/unit/test_config.py tests/unit/test_pcb_manager.py tests/unit/test_geometry_manager.py tests/unit/test_path_manager.py tests/unit/test_align_manager.py tests/unit/test_gcode_manager.py tests/unit/test_gcode_drill_converter.py tests/unit/test_macros_manager.py tests/unit/test_commands_manager.py tests/unit/test_drill_path_optimizer.py tests/unit/test_gerber_path_optimizer.py tests/unit/test_pyclipper2shapely.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run UI tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_ui_*.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run integration tests
      continue-on-error: true
      run: |
        python -m pytest tests/integration -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing

    - name: Run tests with coverage
      run: |
        python -m pytest tests -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        verbose: true  # Add more detailed upload information
