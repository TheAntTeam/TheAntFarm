# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libegl1 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xfixes0 \
          libxcb-cursor0 \
          libxkbcommon-x11-0 \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libxcb1 \
          '^libxcb.*-dev' \
          libx11-xcb-dev \
          libglu1-mesa-dev \
          libxrender-dev \
          libxi-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    - name: Check code formatting
      continue-on-error: true
      run: |
        echo "Checking code formatting with Black (non-blocking)..."
        black --check --diff --exclude="(app_resources_rc|ui_the_ant_farm|hook-vispy|vispy_qt_widget)\.py" src/TheAntFarm tests || echo "Black formatting issues found - check output above"
        isort --check-only --diff --profile=black --line-length=120 --skip-glob="**/*app_resources_rc.py" --skip-glob="**/*ui_the_ant_farm.py" --skip-glob="**/*hook-vispy.py" --skip-glob="**/*vispy_qt_widget.py" src tests || echo "Import sorting issues found - check output above"

    - name: Lint with flake8
      continue-on-error: true
      run: |
        echo "Running flake8 checks (non-blocking)..."
        # check for Python syntax errors or undefined names
        flake8 . --exclude app_resources_rc.py,ui_the_ant_farm.py,hook-vispy.py,vispy_qt_widget.py --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Critical flake8 issues found - check output above"
        # check for style issues
        flake8 . --exclude app_resources_rc.py,ui_the_ant_farm.py,hook-vispy.py,vispy_qt_widget.py --count --max-complexity=10 --max-line-length=120 --extend-ignore=E203 --statistics || echo "Style issues found - check output above"
    
    - name: Type checking
      continue-on-error: true
      run: |
        echo "Running mypy type checking (non-blocking)..."
        mypy src/TheAntFarm tests --ignore-missing-imports || echo "Type checking issues found - check output above"
    
    - name: Run controller tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_controller_*.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run settings tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_settings_*.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run shape core tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_shape_core.py tests/unit/test_pcb_manager.py tests/unit/test_gcode_manager.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run UI tests
      continue-on-error: true
      run: |
        python -m pytest tests/unit/test_ui_*.py -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing
    - name: Run integration tests
      continue-on-error: true
      run: |
        python -m pytest tests/integration -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing

    - name: Run tests with coverage
      run: |
        python -m pytest tests -v --cov=src/TheAntFarm --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        verbose: true  # Add more detailed upload information
    
    - name: Build Executable
      run: |
        python -m pip install pyinstaller
        cd src
        cd TheAntFarm
        pyinstaller the_ant_farm.spec
        cd ..
        cd ..
    - if: ${{ matrix.os != 'windows-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: the_ant_farm_${{ matrix.python-version }}_${{ matrix.os }}_${{ github.sha }}_${{ github.run_number }}
        path: src/TheAntFarm/dist/the_ant_farm
    - if: ${{ matrix.os == 'windows-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: the_ant_farm_${{ matrix.python-version }}_${{ matrix.os }}_${{ github.sha }}_${{ github.run_number }}
        path: src/TheAntFarm/dist/the_ant_farm.exe
