name: build-executable.yml

on:
    workflow_run:
        workflows: ["Python application"]
        types: [completed]
    workflow_dispatch:

jobs:
    build:
        if: >
            github.event_name == 'workflow_dispatch' ||
            (
                github.event.workflow_run.conclusion == 'success' &&
                (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev')
            )
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: [3.12]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                # For workflow_run, build the same commit that passed CI.
                ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

            - name: Cache pip
              uses: actions/cache@v3
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
                restore-keys: |
                  ${{ runner.os }}-pip-

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                    sudo apt-get update
                    sudo apt-get install -y \
                        libegl1 \
                        libxcb-icccm4 \
                        libxcb-image0 \
                        libxcb-keysyms1 \
                        libxcb-randr0 \
                        libxcb-render-util0 \
                        libxcb-shape0 \
                        libxcb-xinerama0 \
                        libxcb-xfixes0 \
                        libxcb-cursor0 \
                        libxkbcommon-x11-0 \
                        libgl1-mesa-dev \
                        libegl1-mesa-dev \
                        libxcb1 \
                        '^libxcb.*-dev' \
                        libx11-xcb-dev \
                        libglu1-mesa-dev \
                        libxrender-dev \
                        libxi-dev \
                        libxkbcommon-dev \
                        libxkbcommon-x11-dev

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pyinstaller

            - name: Build executable
              run: |
                cd src
                cd TheAntFarm
                pyinstaller the_ant_farm.spec
                cd ..
                cd ..

            # An ELF executable has no icon: on Linux the icon of the launcher comes
            # from the desktop entry and from the icon theme, so the executable is
            # shipped together with them.
            - name: Package the Linux desktop integration
              if: runner.os == 'Linux'
              run: |
                cd src/TheAntFarm/dist
                mkdir -p package
                cp the_ant_farm package/
                cp ../../../packaging/linux/the_ant_farm.desktop package/
                mkdir -p "package/icons/256x256/apps"
                cp "../resources/logo/the_ant_farm_logo.png" "package/icons/256x256/apps/the_ant_farm.png"
                for size in 128 64 48 32; do
                  mkdir -p "package/icons/${size}x${size}/apps"
                  cp "../resources/logo/the_ant_farm_logo_${size}.png" "package/icons/${size}x${size}/apps/the_ant_farm.png"
                done
                tar -czf the_ant_farm-linux.tar.gz -C package .

            - name: Upload artifact
              if: runner.os != 'Linux'
              uses: actions/upload-artifact@v4
              with:
                name: theantfarm_${{ matrix.os }}_py${{ matrix.python-version }}_${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}_${{github.run_number}}
                path: ${{ matrix.os == 'windows-latest' && 'src/TheAntFarm/dist/the_ant_farm.exe' || 'src/TheAntFarm/dist/the_ant_farm' }}

            - name: Upload artifact (Linux)
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v4
              with:
                name: theantfarm_${{ matrix.os }}_py${{ matrix.python-version }}_${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}_${{github.run_number}}
                path: src/TheAntFarm/dist/the_ant_farm-linux.tar.gz
