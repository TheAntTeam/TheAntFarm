name: build-executable.yml

# Builds the executable on Linux, Windows and macOS after the tests pass on main or dev, from the Actions page, or for
# the "Release" workflow, which passes the version to put in the file names.
on:
    workflow_call:
        inputs:
            version:
                description: "Version written in the names of the packaged files"
                type: string
                required: true
    workflow_run:
        workflows: ["Python application"]
        types: [completed]
    workflow_dispatch:

jobs:
    build:
        if: >
            inputs.version ||
            github.event_name == 'workflow_dispatch' ||
            (
                github.event.workflow_run.conclusion == 'success' &&
                (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev')
            )
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: [3.12]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                # For workflow_run, build the same commit that passed CI.
                ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

            - name: Cache pip
              uses: actions/cache@v3
              with:
                path: ~/.cache/pip
                key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
                restore-keys: |
                  ${{ runner.os }}-pip-

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                    sudo apt-get update
                    sudo apt-get install -y \
                        libegl1 \
                        libxcb-icccm4 \
                        libxcb-image0 \
                        libxcb-keysyms1 \
                        libxcb-randr0 \
                        libxcb-render-util0 \
                        libxcb-shape0 \
                        libxcb-xinerama0 \
                        libxcb-xfixes0 \
                        libxcb-cursor0 \
                        libxkbcommon-x11-0 \
                        libgl1-mesa-dev \
                        libegl1-mesa-dev \
                        libxcb1 \
                        '^libxcb.*-dev' \
                        libx11-xcb-dev \
                        libglu1-mesa-dev \
                        libxrender-dev \
                        libxi-dev \
                        libxkbcommon-dev \
                        libxkbcommon-x11-dev

            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pyinstaller

            - name: Build executable
              run: |
                cd src
                cd TheAntFarm
                pyinstaller the_ant_farm.spec
                cd ..
                cd ..

            # The executable is packed in an archive, which keeps its permission to run on Linux and macOS.
            # An ELF executable has no icon: on Linux the icon of the launcher comes
            # from the desktop entry and from the icon theme, so the executable is
            # shipped together with them.
            - name: Package the executable
              shell: bash
              env:
                VERSION: ${{ inputs.version }}
              run: |
                cd src/TheAntFarm/dist
                mkdir -p package release
                case "$RUNNER_OS" in
                  Windows) os=windows; cp the_ant_farm.exe package/ ;;
                  macOS) os=macos; cp the_ant_farm package/ ;;
                  Linux)
                    os=linux
                    cp the_ant_farm package/
                    cp ../../../packaging/linux/the_ant_farm.desktop package/
                    mkdir -p "package/icons/256x256/apps"
                    cp "../resources/logo/the_ant_farm_logo.png" "package/icons/256x256/apps/the_ant_farm.png"
                    for size in 128 64 48 32; do
                      mkdir -p "package/icons/${size}x${size}/apps"
                      cp "../resources/logo/the_ant_farm_logo_${size}.png" "package/icons/${size}x${size}/apps/the_ant_farm.png"
                    done
                    ;;
                esac
                name="the_ant_farm${VERSION:+-$VERSION}-$os"
                case "$os" in
                  linux) tar -czf "release/$name.tar.gz" -C package . ;;
                  windows) (cd package && 7z a -tzip "../release/$name.zip" .) ;;
                  macos) (cd package && zip -r "../release/$name.zip" .) ;;
                esac
                ls -l release

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                name: theantfarm_${{ matrix.os }}_py${{ matrix.python-version }}_${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}_${{github.run_number}}
                path: src/TheAntFarm/dist/release/*
                if-no-files-found: error
