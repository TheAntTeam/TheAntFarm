[tool.poetry]
name = "TheAntFarm"
version = "0.3.2"
description = "TheAntFarm is an application that simplifies the PCB creation using CNC machines."
authors = ["The Ant Team"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
freetype-py = "2.5.1"
hsluv = ">=5.0.2"
kiwisolver = "1.4.8"
numpy = "2.2.4"
gerbyx = "0.3.0"
pyclipper = "1.3.0.post6"
PyOpenGL = ">=3.1.9"
PySide6 = "6.8.3"
qimage2ndarray = "1.10.0"
scipy = "1.15.2"
Shapely = "2.0.7"
shiboken6 = "6.8.3"
vispy = ">=0.14.3"
opencv-python = ">=4.11.0.86"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
# Generated by Qt tools or taken from third parties: not formatted nor linted.
extend-exclude = [
    "**/app_resources_rc.py",
    "**/ui_the_ant_farm.py",
    "**/hook-vispy.py",
    "**/vispy_qt_widget.py",
]
# Apply the exclusions also to the files named on the command line (pre-commit passes them one by one).
force-exclude = true

[tool.ruff.lint]
# The rules of flake8 (pycodestyle errors and warnings, pyflakes, mccabe) and of isort used before Ruff.
select = ["E", "W", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
