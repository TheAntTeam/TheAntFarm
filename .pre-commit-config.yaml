repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # The excluded files and the rules are in pyproject.toml ([tool.ruff]).
      - id: ruff-check
        args: ["--fix"]
        stages: [manual]
      - id: ruff-format
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        stages: [manual]
        exclude: |
          (?x)^(
            .*app_resources_rc\.py|
            .*ui_the_ant_farm\.py|
            .*hook-vispy\.py|
            .*vispy_qt_widget\.py
          )$
